<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu hamburguer</title>
    <link rel="stylesheet" href="./Styles/style.css">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,home,settings,person" />
</head>
<body onresize="mudarTamanho()">
    <header class="cabecalho">
        <h1 class="cabecalho-titulo">Testando responsividade</h1>
        
        <span class="material-symbols-outlined" id="burguer" onclick="aparecerMenu()">
            menu
        </span>
        <nav class="cabecalho-menu">
            <ul class="cabecalho-menu-lista">
                <li>
                    <a href="#" class="cabecalho-menu-lista-links">
                    <span class="material-symbols-outlined" id="menu-icons">
                    home
                    </span>
                    <h1 class="cabecalho-menu-lista-link-texto">Início</h1>
                    </a></li>
                <li>
                    <a href="#" class="cabecalho-menu-lista-links">
                    <span class="material-symbols-outlined" id="menu-icons">
                     person
                    </span>
                    <h1 class="cabecalho-menu-lista-link-texto">Sobre</h1>
                    </a></li>
                <li>
                    <a href="#" class="cabecalho-menu-lista-links" >
                    <span class="material-symbols-outlined" id="menu-icons">
                    settings
                    </span>
                    <h1 class="cabecalho-menu-lista-link-texto">Configurações</h1>
                    </a></li>
            </ul>
        </nav>
    </header>
    <script src="script.js"></script>
</body>
</html>
